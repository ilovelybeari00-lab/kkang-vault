<script>
(function () {
  var VAULT = "https://raw.githubusercontent.com/ilovelybeari00-lab/kkang-vault/main/";   // 금고 주소 (keys.json, index.json, items/<id>.json)
  // 탭: items.json의 "tabs"가 있으면 그 순서, 없으면 아래 기본값. 항목은 "tab"(없으면 예전 "kind")으로 탭을 고르고, "group"으로 탭 안 폴더를 나눈다
  var TABS = ['수지기출', '강남기출', '사설모의', '학생용', '자작문제'];
  // 탭마다 아카이브(학교·학년·과목 줄 + 시험별·난이도별·지수순)로 보여 준다. 금고 설정의 "plain"에 적은 탭만 예전 목록 모양.
  // 학교 줄 목록은 금고 설정 "schools"({탭: [학교…]}, 예전 꼴 [학교…]는 수지기출 것) + 항목에 적힌 학교.
  var ABOUT = {
    '수지기출': '수지 지역 학교 기출과 대비 문항을 시험별·난이도별로 모아 두는 곳.',
    '강남기출': '강남 지역 학교 기출을 시험별·난이도별로 모아 두는 곳.',
    '사설모의': '사설 모의고사 문항을 회차별·난이도별로 모아 두는 곳.',
    '학생용': '학생에게 내줄 문항과 자료를 모아 두는 곳.',
    '자작문제': '직접 만든 문항을 난이도별로 모아 두는 곳.'
  };
  var ROW_LABEL = { '사설모의': '출제처' };
  var $ = function (id) { return document.getElementById(id); };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  // ── 금고 열기: 비밀번호로 개인키를 풀고, 목록(잠긴 칸)을 푼다. 풀이 HTML은 열 때 그 항목만 받아 온다 ──
  var PRIV = null, BODY = {};
  // 보이는 이름 바꾸기 : 금고 설정(잠긴 cfg)의 labels {원래 이름: 보이는 이름}. 자료에 적힌 이름은 그대로 두고 화면에서만 바꾼다
  var LABELS = {};
  var L = function (name) { return LABELS[name] || name; };
  var get = function (p) { return fetch(VAULT + p + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(p); return r.json(); }); };
  var INFO = new TextEncoder().encode('kkang-vault-v1');
  function sharedKey(priv, pub) {
    return crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, priv, 256).then(function (bits) {
      return crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    }).then(function (hk) {
      return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: INFO }, hk, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    });
  }
  function openBox(box) {
    return crypto.subtle.importKey('raw', b64(box.epk), { name: 'ECDH', namedCurve: 'P-256' }, false, []).then(function (epk) {
      return sharedKey(PRIV, epk);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.c));
    }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function decrypt(pw) {
    var enc = new TextEncoder();
    return Promise.all([get('keys.json'), get('index.json')]).then(function (r) {
      var keys = r[0], idx = r[1], w = keys.wrapped;
      return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(w.s), iterations: w.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.i) }, k, b64(w.c));
      }).then(function (buf) {
        return crypto.subtle.importKey('jwk', JSON.parse(new TextDecoder().decode(buf)), { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
      }).then(function (priv) {
        PRIV = priv;
        return Promise.all([idx.cfg ? openBox(idx.cfg) : {}, Promise.all(idx.items.map(openBox))]);
      }).then(function (r2) { var c = r2[0] || {}; LABELS = c.labels || {}; return { tabs: c.tabs, schools: c.schools, labels: LABELS, plain: c.plain, about: c.about, rowLabel: c.rowLabel, items: r2[1] }; });
    });
  }
  // 풀이 HTML 받아 오기 (한 번 연 것은 기억)
  function loadBody(id, el) {
    var done = function (h) { el.innerHTML = h; if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]); };
    if (BODY[id] !== undefined) return done(BODY[id]);
    el.innerHTML = '<p class="mls-empty">불러오는 중…</p>';
    get('items/' + id + '.json').then(openBox).then(function (o) { BODY[id] = o.html || ''; done(BODY[id]); })
      .catch(function () { el.innerHTML = '<p class="mls-empty">풀이를 불러오지 못했어요. 새로고침해 보세요.</p>'; });
  }

  function itemTab(x) { return x.tab || x.kind || '풀이'; }

  function tabBody(items, tab) {
    var list = items.filter(function (x) { return itemTab(x) === tab; });
    if (!list.length) return '<p class="mls-empty">' + esc(L(tab)) + ' 폴더는 아직 비어 있어요.</p>';
    var groups = list.map(function (x) { return x.group || ''; }).filter(function (g, i, a) { return a.indexOf(g) === i; });
    return groups.map(function (g) {
      var inG = list.filter(function (x) { return (x.group || '') === g; });
      return '<section class="mls-group">' + (g ? '<h4>' + esc(g) + '</h4>' : '') + inG.map(function (x) {
        return '<details data-load="' + esc(x._k || x.id || '') + '"><summary>' + esc(x.title) + (x.date ? '<small>' + esc(x.date) + '</small>' : '') + '</summary><div class="mls-body"></div></details>';
      }).join('') + '</section>';
    }).join('');
  }

  // ── 아카이브 (공개 아카이브 blogger/archive-page.html과 같은 구조 + 학교 줄) ──
  // 항목 칸: school, grade(학년), subject, exam(예: 2018 11월 고2 학평 / 2026 2학기 중간), year, no(문항 번호),
  //          diff(난이도 J1~K5), index(난이도 지수 0~100), kind(성격), title, html. tools/secret_item.py가 만든다.
  // 과목 줄 순서 (2022 개정 고1 공통 → 선택). 목록에 없는 과목도 자료에 있으면 뒤에 붙는다
  var SUBJECTS = ['공통수학1', '공통수학2', '대수', '미적분I', '확률과통계', '미적분II', '기하'];
  var SUBJECT_SHORT = { '공통수학1': '공수1', '공통수학2': '공수2', '대수': '대수', '미적분I': '미적I', '확률과통계': '확통', '미적분II': '미적II', '기하': '기하' };
  // 문항 번호 순서: 객관식·단답 번호 → 서술형(서1, 서2 …)
  var noKey = function (x) { var s = String(x.no || ''); var m = s.match(/\d+/); return (/^서/.test(s) ? 1000 : 0) + (m ? +m[0] : 0); };
  var LEVELS = [
    { code: 'K5', name: '킬러 5단계', color: '#8e1b10' }, { code: 'K4', name: '킬러 4단계', color: '#a3271a' },
    { code: 'K3', name: '킬러 3단계', color: '#c0392b' }, { code: 'K2', name: '킬러 2단계', color: '#d0533f' },
    { code: 'K1', name: '킬러 1단계', color: '#dc6e55' }, { code: 'J3', name: '준킬러 3단계', color: '#9a6f05' },
    { code: 'J2', name: '준킬러 2단계', color: '#b8860b' }, { code: 'J1', name: '준킬러 1단계', color: '#cfa23a' },
    { code: '', name: '기본', color: '#2f6f5e' }
  ];
  var lvOf = function (x) { return (x.diff || '').charAt(0) === 'K' ? 'killer' : (x.diff || '').charAt(0) === 'J' ? 'semi' : ''; };
  var yearOf = function (x) { return +x.year || +(String(x.exam || x.term || '').match(/\d{4}/) || [0])[0]; };
  var examOf = function (x) { return x.exam || x.term || '기타'; };
  var idx = function (x) { return typeof x.index === 'number' ? x.index : null; };
  var uniq = function (a) { return a.filter(function (v, i) { return v && a.indexOf(v) === i; }); };
  var byIndex = function (a, b) { return (idx(a) === null) - (idx(b) === null) || (idx(b) || 0) - (idx(a) || 0); };

  function chip(x, withExam, noIndex) {
    var tip = (x.title || '') + (idx(x) !== null ? ' · 지수 ' + idx(x) : '') + (x.kind ? ' · ' + x.kind : '');
    return '<button type="button" class="mls-chip ' + lvOf(x) + '" data-open="' + esc(x.id || x.title) + '" title="' + esc(tip) + '">' +
      '<b>' + esc(x.no || '·') + '</b>' + (x.subject ? '<em>' + esc(SUBJECT_SHORT[x.subject] || x.subject) + '</em>' : '') +
      (x.school ? '<i>' + esc(L(x.school)) + '</i>' : '') + (withExam ? '<i>' + esc(examOf(x)) + '</i>' : '') +
      (withExam && !noIndex && idx(x) !== null ? '<small>' + idx(x) + '</small>' : '') + '</button>';
  }

  function byExam(list) {
    var years = uniq(list.map(yearOf)).sort(function (a, b) { return b - a; });
    if (list.some(function (x) { return !yearOf(x); })) years.push(0);
    return years.map(function (y) {
      var inY = list.filter(function (x) { return yearOf(x) === y; });
      var exams = uniq(inY.map(examOf)).sort().reverse();
      return '<section class="mls-year"><h5>' + (y || '연도 미상') + '<small>' + inY.length + '문항</small></h5>' + exams.map(function (e) {
        var l = inY.filter(function (x) { return examOf(x) === e; }).sort(function (a, b) { return noKey(a) - noKey(b); });
        return '<div class="mls-exam"><div class="mls-exam-name">' + esc(e) + '</div><div class="mls-chips">' + l.map(function (x) { return chip(x); }).join('') + '</div></div>';
      }).join('') + '</section>';
    }).join('');
  }

  function byLevel(list) {
    return '<section class="mls-year"><h5>난이도 높은 순<small>' + list.length + '문항</small></h5>' + LEVELS.map(function (lv) {
      var l = list.filter(function (x) { return (x.diff || '') === lv.code; }).sort(byIndex);
      if (!l.length) return '';
      return '<div class="mls-exam"><div class="mls-exam-name"><span class="mls-lv" style="background:' + lv.color + '">' + (lv.code || '기본') + '</span>' + lv.name + '</div>' +
        '<div class="mls-chips">' + l.map(function (x) { return chip(x, true); }).join('') + '</div></div>';
    }).join('') + '</section>';
  }

  function byRank(list, hardFirst) {
    var l = list.filter(function (x) { return idx(x) !== null; }).sort(byIndex);
    if (!hardFirst) l.reverse();
    return '<section class="mls-year"><h5>난이도 지수 ' + (hardFirst ? '높은' : '낮은') + ' 순<button type="button" class="mls-order" data-order="1">' +
      (hardFirst ? '쉬운 것부터 보기' : '어려운 것부터 보기') + '</button></h5>' + l.map(function (x) {
        var lv = LEVELS.filter(function (v) { return v.code === (x.diff || ''); })[0] || LEVELS[LEVELS.length - 1];
        return '<div class="mls-rank"><span>' + idx(x) + '</span><div><span class="mls-lv" style="background:' + lv.color + '">' + (lv.code || '기본') + '</span>' +
          chip(x, true, true) + (x.kind ? ' <span style="color:var(--muted);font-size:13px">' + esc(x.kind) + '</span>' : '') + '</div></div>';
      }).join('') + '</section>';
  }

  function schoolsFor(data, tab) {
    var cfg = data.schools || [];
    var list = Array.isArray(cfg) ? (tab === '수지기출' ? cfg : []) : (cfg[tab] || []);
    return list.map(function (s) { return s.name || s; });
  }

  function archiveBody(data, items, v, tab) {
    var all = items.filter(function (x) { return itemTab(x) === tab; });
    var schools = uniq(schoolsFor(data, tab).concat(all.map(function (x) { return x.school; })));
    var subjects = SUBJECTS.filter(function (s) { return all.some(function (x) { return x.subject === s; }); })
      .concat(uniq(all.map(function (x) { return x.subject; })).filter(function (s) { return SUBJECTS.indexOf(s) < 0; }));
    // 학년 줄 : 1학년, 2학년, 3학년 순 (항목의 "grade")
    var grades = uniq(all.map(function (x) { return x.grade; })).sort(function (a, b) { return (parseInt(a, 10) || 9) - (parseInt(b, 10) || 9); });
    // 학교 → 학년 → 과목 순서로 좁힌다. 줄마다 숫자는 '위 줄에서 고른 것' 안에서 센다 (아래 줄 선택은 위 줄 숫자에 영향 없음)
    var KEYS = ['school', 'grade', 'subject'];
    var above = function (key) { return KEYS.slice(0, KEYS.indexOf(key)); };
    var within = function (x, keys) { return keys.every(function (k) { return !v[k] || x[k] === v[k]; }); };
    // 위 줄을 바꿔서 아래 줄에서 고른 값이 없어지면 그 줄은 '전체'로 돌린다
    KEYS.forEach(function (k) { if (v[k] && !all.some(function (x) { return within(x, above(k)) && x[k] === v[k]; })) v[k] = ''; });
    var list = all.filter(function (x) { return within(x, KEYS); });
    var row = function (key, opts, label, hideEmpty) {
      var base = all.filter(function (x) { return within(x, above(key)); });
      var shown = [''].concat(opts.filter(function (o) { return !hideEmpty || base.some(function (x) { return x[key] === o; }); }));
      return '<p class="mls-rowlabel">' + label + '</p><div class="mls-filter" style="margin-top:4px">' + shown.map(function (o) {
        var n = o ? base.filter(function (x) { return x[key] === o; }).length : base.length;
        return '<button type="button" data-' + key + '="' + esc(o) + '" aria-pressed="' + ((v[key] || '') === o) + '">' + (o ? esc(L(o)) : '전체') + ' <span style="opacity:.6;font-size:12px">' + n + '</span></button>';
      }).join('') + '</div>';
    };
    var open = v.open ? all.filter(function (x) { return (x.id || x.title) === v.open; })[0] : null;
    var detail = open ? '<div class="mls-detail" id="mls-detail"><button type="button" class="mls-back" data-open="">← 목록</button>' +
      '<h5>' + esc(open.title || '') + '</h5><div>' + [L(open.school), open.grade, open.subject, open.unit, open.diff, idx(open) !== null ? '지수 ' + idx(open) : '', open.kind]
        .filter(Boolean).map(function (t) { return '<span class="mls-tag">' + esc(t) + '</span>'; }).join('') + '</div><div class="mls-body" id="mls-detail-body" data-id="' + esc(open._k || open.id || '') + '"></div></div>' : '';
    var body = !list.length ? '<p class="mls-empty" style="margin-top:14px">' + ([v.school, v.grade, v.subject].filter(Boolean).length ? esc([v.school, v.grade, v.subject].filter(Boolean).join(' · ')) + ' 자료는 아직 비어 있어요.' : '아직 정리한 문항이 없어요. 자료가 들어오면 여기에 시험별로 쌓여요.') + '</p>'
      : v.view === 'level' ? byLevel(list) : v.view === 'index' ? byRank(list, v.hard !== false) : byExam(list);
    var about = ((data.about || {})[tab]) || ABOUT[tab] || '문항을 시험별·난이도별로 모아 두는 곳.';
    return '<div class="mls-hero"><h4>' + esc(L(tab)) + ' 아카이브</h4><p>' + esc(about) + ' 번호를 누르면 풀이가 열려요.</p>' +
      '<div class="mls-stats"><div class="mls-stat"><span>정리한 문항</span><b>' + list.length + '</b></div>' +
      '<div class="mls-stat"><span>시험 회차</span><b>' + uniq(list.map(examOf)).length + '</b></div>' +
      '<div class="mls-stat"><span>킬러 문항</span><b>' + list.filter(function (x) { return lvOf(x) === 'killer'; }).length + '</b></div></div>' +
      '<div class="mls-legend"><span><i style="background:#2f6f5e"></i>일반</span><span><i style="background:#b8860b"></i>준킬러</span><span><i style="background:#c0392b"></i>킬러</span></div></div>' +
      (schools.length ? row('school', schools, ((data.rowLabel || {})[tab]) || ROW_LABEL[tab] || '학교') : '') + (grades.length ? row('grade', grades, '학년', true) : '') + (subjects.length ? row('subject', subjects, '과목', true) : '') +
      '<div class="mls-views" role="tablist">' + [['exam', '시험별'], ['level', '난이도별'], ['index', '지수순']].map(function (p) {
        return '<button type="button" role="tab" data-view="' + p[0] + '" aria-selected="' + ((v.view || 'exam') === p[0]) + '">' + p[1] + '</button>';
      }).join('') + '</div>' + detail + body;
  }

  function render(data) {
    var items = data.items || [];
    var tabs = (data.tabs || TABS).slice();
    items.forEach(function (x) { if (tabs.indexOf(itemTab(x)) < 0) tabs.push(itemTab(x)); });
    var bar = '<div class="mls-tabs" role="tablist">' + tabs.map(function (t, i) {
      var n = items.filter(function (x) { return itemTab(x) === t; }).length;
      return '<button type="button" role="tab" data-tab="' + i + '" aria-selected="' + (i === 0) + '">' + esc(L(t)) + '<small>' + n + '</small></button>';
    }).join('') + '</div><div id="mls-tab"></div>';
    $('mls-open').innerHTML = '<div class="mls-top"><h3>비밀 폴더</h3><button type="button" id="mls-close">잠그기</button></div>' + bar;
    var views = {}, plain = data.plain || [];
    var show = function (i) {
      var view = views[tabs[i]] = views[tabs[i]] || { school: '', grade: '', subject: '', view: 'exam', hard: true, open: '' };
      [].forEach.call($('mls-open').querySelectorAll('.mls-tabs button'), function (b) { b.setAttribute('aria-selected', String(+b.dataset.tab === i)); });
      $('mls-tab').innerHTML = plain.indexOf(tabs[i]) < 0 ? archiveBody(data, items, view, tabs[i]) : tabBody(items, tabs[i]);
      var on = function (attr, fn) { [].forEach.call($('mls-tab').querySelectorAll('[' + attr + ']'), function (b) { b.onclick = function () { fn(b.getAttribute(attr)); show(i); }; }); };
      on('data-school', function (v) { view.school = v; view.open = ''; });
      on('data-grade', function (v) { view.grade = v; view.open = ''; });
      on('data-subject', function (v) { view.subject = v; view.open = ''; });
      on('data-view', function (v) { view.view = v; });
      on('data-order', function () { view.hard = !view.hard; });
      on('data-open', function (v) { view.open = v; });
      if (view.open && $('mls-detail')) { loadBody($('mls-detail-body').getAttribute('data-id'), $('mls-detail-body')); $('mls-detail').scrollIntoView({ block: 'start' }); }
      [].forEach.call($('mls-tab').querySelectorAll('details[data-load]'), function (d) {
        d.addEventListener('toggle', function () { if (d.open) loadBody(d.getAttribute('data-load'), d.querySelector('.mls-body')); });
      });
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([$('mls-tab')]);
    };
    [].forEach.call($('mls-open').querySelectorAll('.mls-tabs button'), function (b) { b.onclick = function () { show(+b.dataset.tab); }; });
    show(0);
    // 풀이 안의 연계 링크: data-vault는 금고 안의 다른 풀이로 바로 가고, 블로그 글은 새 창(금고가 잠기지 않게)
    $('mls-tab').onclick = function (e) {
      var a = e.target.closest && e.target.closest('.mls-body a[href]');
      if (!a) return;
      var id = a.getAttribute('data-vault');
      if (!id) { a.target = '_blank'; a.rel = 'noopener'; return; }
      e.preventDefault();
      var x = items.filter(function (it) { return (it.id || it.title) === id; })[0];
      if (!x) return;
      var i = tabs.indexOf(itemTab(x));
      if (!views[tabs[i]]) show(i);
      views[tabs[i]].open = id;
      show(i);
    };
    $('mls-lock').hidden = true;
    $('mls-open').hidden = false;
    $('mls-close').onclick = function () { $('mls-open').innerHTML = ''; $('mls-open').hidden = true; $('mls-lock').hidden = false; $('mls-pw').value = ''; $('mls-msg').textContent = ''; };
  }

  $('mls-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('mls-pw').value;
    if (!pw) return;
    $('mls-go').disabled = true;
    $('mls-msg').className = 'mls-msg';
    $('mls-msg').textContent = '여는 중…';
    decrypt(pw).then(render).catch(function () {
      $('mls-msg').className = 'mls-msg err';
      $('mls-msg').textContent = PRIV ? '자료를 여는 중에 문제가 생겼어요. 새로고침해 보세요.' : '비밀번호가 맞지 않거나 금고에 연결하지 못했어요.';
    }).then(function () { $('mls-go').disabled = false; });
  });
})();
</script>
